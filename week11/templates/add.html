{% extends 'base.html' %}

{% block title %}Add Coaster - Coaster Tracker{% endblock %}

{% block content %}
<div class="form-container">
    <header class="page-header">
        <h1>Add a New Coaster</h1>
        <p>Log a new rollercoaster you just rode.</p>
    </header>

    <form method="POST" class="coaster-form">
        <div class="form-group">
            <label for="name">Rollercoaster Name</label>
            <input type="text" id="name" name="name" required placeholder="e.g. Millennium Force">
        </div>
        <div class="form-group">
            <label for="park_id">Theme Park</label>
            {% if parks %}
            <select id="park_id" name="park_id" required>
                <option value="" disabled selected>Select a park...</option>
                {% for park in parks %}
                <option value="{{ park.id }}">{{ park.name }}</option>
                {% endfor %}
            </select>
            {% else %}
            <p style="color: var(--text-secondary); margin-bottom: 0.5rem; background: rgba(15,23,42,0.5); padding: 1rem; border-radius: 12px; border: 1px solid var(--border-color);">No parks available. <a href="{{ url_for('park_add') }}" style="color: #3b82f6;">Add a park first</a>.</p>
            {% endif %}
        </div>
        <div class="form-group">
            <label for="height">Height (in meters)</label>
            <input type="number" id="height" name="height" step="0.1" required placeholder="e.g. 94.5">
        </div>
        <div class="form-group">
            <label for="rating">Rating (out of 10)</label>
            <input type="number" id="rating" name="rating" min="1" max="10" required placeholder="10">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Add Rollercoaster</button>
    </form>
</div>
{% endblock %}
