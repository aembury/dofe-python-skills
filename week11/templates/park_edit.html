{% extends 'base.html' %}

{% block title %}Edit Park - Coaster Tracker{% endblock %}

{% block content %}
<div class="form-container">
    <header class="page-header">
        <h1>Edit Theme Park</h1>
        <p>Update the location details for {{ park.name }}.</p>
    </header>

    <form method="POST" class="coaster-form">
        <div class="form-group">
            <label for="name">Park Name</label>
            <input type="text" id="name" name="name" value="{{ park.name }}" required>
        </div>
        <div class="form-group">
            <label for="latitude">Latitude</label>
            <input type="number" id="latitude" name="latitude" step="0.000001" value="{{ park.latitude if park.latitude else '' }}">
        </div>
        <div class="form-group">
            <label for="longitude">Longitude</label>
            <input type="number" id="longitude" name="longitude" step="0.000001" value="{{ park.longitude if park.longitude else '' }}">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
        <a href="{{ url_for('parks') }}" class="btn btn-secondary btn-block text-center" style="margin-top: 1rem;">Cancel</a>
    </form>
</div>
{% endblock %}
