{% extends 'base.html' %}

{% block title %}Edit Coaster - Coaster Tracker{% endblock %}

{% block content %}
<div class="form-container">
    <header class="page-header">
        <h1>Edit Rollercoaster</h1>
        <p>Update the details for {{ coaster.name }}.</p>
    </header>

    <form method="POST" class="coaster-form">
        <div class="form-group">
            <label for="name">Rollercoaster Name</label>
            <input type="text" id="name" name="name" value="{{ coaster.name }}" required>
        </div>
        <div class="form-group">
            <label for="park_id">Theme Park</label>
            <select id="park_id" name="park_id" required>
                {% for park in parks %}
                <option value="{{ park.id }}" {% if park.id == coaster.park_id %}selected{% endif %}>{{ park.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="height">Height (in meters)</label>
            <input type="number" id="height" name="height" step="0.1" value="{{ coaster.height }}" required>
        </div>
        <div class="form-group">
            <label for="rating">Rating (out of 10)</label>
            <input type="number" id="rating" name="rating" min="1" max="10" value="{{ coaster.rating }}" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary btn-block text-center" style="margin-top: 1rem;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
