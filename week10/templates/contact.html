{% extends 'base.html' %}

{% block title %}Contact - My Flask App{% endblock %}

{% block content %}
    <h1>Contact Us</h1>
    
    {% if message %}
        <div style="background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid rgba(16, 185, 129, 0.2);">
            {{ message }}
        </div>
    {% endif %}
    
    <p>We would love to hear from you. Send us a message using the form below:</p>
    <form method="POST" action="{{ url_for('contact') }}">
        <div style="margin-bottom: 1.5rem;">
            <label for="message" style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: #f8fafc;">Your Message:</label>
            <textarea id="message" name="message" rows="5" style="width: 100%; box-sizing: border-box; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-family: inherit; font-size: 1rem;" required placeholder="Type your message here..."></textarea>
        </div>
        <button type="submit">Send Message</button>
    </form>
{% endblock %}
